name: Release

# Builds the installers (PLAN §9.3):
#  - push a tag like v1.2.0  → macOS (Apple Silicon + Intel dmg/zip) and Windows (NSIS) are built,
#    then one job attaches them all to a *draft* GitHub Release; write the notes for non-technical
#    readers, then publish.
#  - run manually (Actions → Release → Run workflow) → the same builds, kept as workflow artifacts
#    only (nothing published), to try an installer before tagging.
#
# The builds never publish themselves: when both finished at the same moment each created its own
# draft (v0.2.0 had two, the installers split between them).
#
# Releases must be downloadable without a GitHub account and readable by the update check, so they
# live in this repository, which is public. Were it made private again, point UPDATE_REPO in
# src/main/context.ts and the release job's GH_REPO at a public releases repository, and give the
# job a RELEASES_TOKEN secret with contents: write there.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege: the builds run every npm package's install scripts and electron-builder, so
# they get a read-only token; only the job that attaches the finished files to the draft can write.
# Actions are pinned to commits (the tag is in the comment): a tag moved by someone else can't
# change what runs here.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # A v0.3.0 release of an app that calls itself 0.2.0 would offer that "update" forever.
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version). Release with: npm version <x.y.z> && git push --follow-tags"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No paid certificates (PLAN §1.4): never look for a signing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.exe
            release/*/*.blockmap
            release/*/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    # Only for tags, and only when every build succeeded: never a release with one platform missing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Attach every installer to one draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The artifacts keep the version folder electron-builder wrote into (dist/0.2.2/…).
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find dist -type f | sort)
          printf '%s\n' "${files[@]}"
          if [[ ${#files[@]} -eq 0 ]]; then echo "::error::No installers were downloaded"; exit 1; fi
          # GitHub accepts several drafts with one tag, so look before creating: a re-run fills the
          # release it made before (gh creates the draft first, then uploads).
          existing=$(gh api "repos/$GH_REPO/releases" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")][0].id // empty")
          if [[ -n "$existing" ]]; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag --title "Slamem ${GITHUB_REF_NAME#v}" \
              --notes "Write what's new for non-technical readers (the app shows it as plain text), then publish."
          fi
