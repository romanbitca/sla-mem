name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Checks only read the code. Actions are pinned to commits (the tag is in the comment): a tag
# moved by someone else can't change what runs here.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows catches path and file-name pitfalls (PLAN §12, items 21–24).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: the token isn't left behind for npm packages' scripts to find.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Tests and type checks don't need the Electron binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
